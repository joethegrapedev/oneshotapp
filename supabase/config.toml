# Supabase CLI project configuration
# Single source of truth for names/shapes is ../CONTRACTS.md — conform exactly.

project_id = "oneshot"

[api]
enabled = true
# Schemas exposed via PostgREST.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Max rows returned by a single request.
max_rows = 1000
port = 54321

[db]
enabled = true
port = 54322
# Local shadow DB port used by `db diff`.
shadow_port = 54320
# Must match the Postgres major version used in production.
major_version = 15

[db.pooler]
enabled = false
port = 54329

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# The base site URL (adjust per environment).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 18+ anonymous journaling app: anonymous sign-ins are required.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ---------------------------------------------------------------------------
# Edge functions. All three require the caller's JWT (verify_jwt = true); each
# function ALSO re-verifies the user via supabase.auth.getUser(jwt) internally.
# ---------------------------------------------------------------------------
[functions.moderate-and-pool]
verify_jwt = true

[functions.serve-entry]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
