# JVM args for the Gradle daemon. 4G heap is a safe default for Flutter + AGP 8.7.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX + Jetifier (required by supabase_flutter / purchases_flutter / posthog).
android.useAndroidX=true
android.enableJetifier=true

# Faster, more parallel builds.
org.gradle.parallel=true
org.gradle.caching=true

# --- CI / proxy note -------------------------------------------------------
# In restricted CI environments a corporate CA or HTTPS proxy may be required
# for Gradle to download the distribution and dependencies. If so, add (do NOT
# commit machine-specific values here — pass them in CI) e.g.:
#   org.gradle.jvmargs=... -Djavax.net.ssl.trustStore=/path/to/cacerts \
#     -Dhttps.proxyHost=proxy.host -Dhttps.proxyPort=port
# and configure ~/.gradle/gradle.properties or GRADLE_OPTS in the CI runner.
# ---------------------------------------------------------------------------
